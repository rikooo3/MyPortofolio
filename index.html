<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile app developer and software engineer. Selected projects, stack and contact.">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header><a href="#top" id="hName"></a><nav><a href="#work">Work</a><a href="#stack">Stack</a><a href="#contact">Contact</a><i class="ind"></i></nav></header>

  <div class="herobox"><canvas id="field" aria-hidden="true"></canvas><div class="hero" id="top">
    <span class="status fi"><i></i><span id="status"></span></span>
    <h1 id="name"></h1>
    <p class="role fi" id="role" style="--d:500"></p>
    <p class="typed fi" style="--d:550" aria-hidden="true"><span class="pfx">&rarr;</span><span id="typed"></span><i class="caret"></i></p>
    <p class="bio fi" id="bio" style="--d:600"></p>
    <div class="links fi" style="--d:700">
      <a class="btn pri" href="#work">View my work</a>
      <a class="btn" id="gh" target="_blank" rel="noopener">GitHub <span class="arr">↗</span></a>
      <button class="btn" id="copy">Copy email</button>
    </div>
  </div></div>

  <section id="work"><h2>Selected work</h2><div id="projects"></div></section>
  <section id="stack"><h2>Stack</h2><p class="hint">Select a technology to see which projects use it.</p><dl class="stack" id="stackList"></dl></section>

  <div class="contact" id="contact">
    <h2 id="cLead"></h2>
    <a class="mail" id="mail"></a>
    <div class="links"><a class="btn pri" id="send">Send email <span class="arr">↗</span></a><button class="btn" id="copy2">Copy email address</button><a class="btn" id="gh2" target="_blank" rel="noopener">GitHub <span class="arr">↗</span></a></div>
  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>

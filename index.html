<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juniar Arif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--tx:#fafafa;--mu:#a1a1aa;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.2);--ac:#10b981;--ease:cubic-bezier(.16,1,.3,1);--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;font-size:14px}
header nav{display:flex;gap:24px;color:var(--mu)}
header nav a:hover{color:var(--tx)}
.hero{padding:72px 0 80px;animation:in .9s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.status{display:inline-flex;align-items:center;gap:9px;font-size:14px;color:var(--mu)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ac)}
h1{font-size:clamp(44px,9vw,84px);line-height:1;letter-spacing:-.04em;font-weight:600;margin:22px 0 14px}
.role{font-size:clamp(18px,2.6vw,22px);color:var(--tx);margin:0 0 20px}
.bio{color:var(--mu);max-width:560px;margin:0 0 32px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;padding:11px 18px;border-radius:10px;border:1px solid var(--bd2);background:transparent;transition:background .25s}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.pri{background:var(--tx);color:#09090b;border-color:var(--tx)}
.btn.pri:hover{background:#e4e4e7}
.arr{display:inline-block;transition:transform .3s var(--ease)}
a:hover>.arr{transform:translate(2px,-2px)}
h2{font-size:14px;font-weight:500;color:var(--mu);margin:0 0 8px;letter-spacing:0}
section{padding:24px 0 56px}
.proj{display:grid;grid-template-columns:1fr auto;gap:8px 32px;padding:28px 0;border-top:1px solid var(--bd)}
.proj:last-child{border-bottom:1px solid var(--bd)}
.proj h3{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:600}
.src{display:inline-block;font-size:12.5px;color:var(--mu);border:1px solid var(--bd2);border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:3px;font-weight:400;letter-spacing:0}
.src.pub{color:var(--ac);border-color:rgba(16,185,129,.35)}
.proj p{margin:6px 0 0;color:var(--mu);max-width:600px;grid-column:1}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:400 12.5px var(--mono);color:var(--mu)}
.plinks{grid-column:2;grid-row:1/span 3;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-size:14.5px}
.plinks a{border-bottom:1px solid var(--bd2);padding-bottom:1px}
.plinks a:hover{border-color:var(--tx)}
details{grid-column:1/-1;margin-top:14px;font-size:14.5px}
summary{cursor:pointer;color:var(--tx);width:max-content}
details ul{color:var(--mu);margin:12px 0 0;padding-left:18px;max-width:640px}
details li{margin-bottom:8px}
.stack{display:grid;grid-template-columns:160px 1fr;gap:12px 24px;font-size:16px}
.stack dt{color:var(--mu)}.stack dd{margin:0}
.contact{border-top:1px solid var(--bd);padding:56px 0 24px}
.mail{display:block;font-size:clamp(22px,5vw,40px);letter-spacing:-.03em;font-weight:600;margin:10px 0 24px;word-break:break-all}
footer{padding:32px 0 48px;color:var(--mu);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);opacity:0;padding:10px 16px;border-radius:10px;background:#18181b;border:1px solid var(--bd2);font-size:14px;transition:all .4s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.proj{grid-template-columns:1fr}.plinks{grid-column:1;grid-row:auto;flex-direction:row;gap:18px;align-items:flex-start;margin-top:8px}.stack{grid-template-columns:1fr;gap:2px 0}.stack dd{margin-bottom:14px}.hero{padding-top:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="#top" id="hName"></a><nav><a href="#work">Work</a><a href="#stack">Stack</a><a href="#contact">Contact</a></nav></header>

  <div class="hero" id="top">
    <span class="status"><i></i><span id="status"></span></span>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="bio" id="bio"></p>
    <div class="links">
      <a class="btn pri" href="#work">View my work</a>
      <a class="btn" id="gh" target="_blank" rel="noopener">GitHub <span class="arr">↗</span></a>
      <button class="btn" id="copy">Copy email</button>
    </div>
  </div>

  <section id="work"><h2>Selected work</h2><div id="projects"></div></section>
  <section id="stack"><h2>Stack</h2><dl class="stack" id="stackList"></dl></section>

  <div class="contact" id="contact">
    <h2 id="cLead"></h2>
    <a class="mail" id="mail"></a>
    <div class="links"><a class="btn pri" id="send">Send email <span class="arr">↗</span></a><button class="btn" id="copy2">Copy email address</button><a class="btn" id="gh2" target="_blank" rel="noopener">GitHub <span class="arr">↗</span></a></div>
  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================================
   PORTFOLIO_DATA — edit only this. Name, links, bio, stack and projects.
   ========================================================================= */
const PORTFOLIO_DATA = {
  name: "Juniar Arif Pratama",                         // <- your real name or alias
  role: "Mobile app developer and software engineer",
  status: "Available for projects",
  bio: "I build Android and cross-platform apps with Kotlin, C++ and React, backed by Node.js and Python. I care about fast startup, low memory use and code that is easy to maintain.",
  github: "https://github.com/yourusername", // <- your GitHub profile
  email: "yourname@gmail.com",               // <- your Gmail
  contactLead: "Hiring or have a project in mind?",
  stack: [
    ["Mobile and native", "Kotlin, C++, React"],
    ["Backend and scripting", "Node.js, Python, JavaScript"]
  ],
  /* PROJECTS. source: "public" (GitHub) or "private" (closed source).
     github: URL or null. live: URL or null. notes: optional list, shown for private projects. */
  projects: [
    { title: "Hybrid Music Streaming App", source: "private",
      summary: "Streaming app with lazy-loaded assets, skeleton loaders, cached database reads and a home screen built from server-defined sections.",
      stack: ["React", "Kotlin", "Android WebView", "Cloud database"], github: null, live: null,
      notes: ["React interface inside a Kotlin Android shell, connected through a native bridge.", "Read-through cache cuts repeat database reads on cold and warm starts.", "Artwork loads near the viewport and is decoded at display size to keep memory low.", "Playback state lives natively and is mirrored to the UI."] },
    { title: "Project Two", source: "public",
      summary: "Replace with a short description of what this project does and the problem it solves.",
      stack: ["C++", "Python"], github: "https://github.com/yourusername/project-two", live: null },
    { title: "Project Three", source: "public",
      summary: "Replace with a short description of this full-stack project.",
      stack: ["Node.js", "JavaScript", "React"], github: "https://github.com/yourusername/project-three", live: null }
  ]
};

/* ============================ Rendering ============================ */
const D = PORTFOLIO_DATA, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
document.title = D.name + " — " + D.role;
$("#hName").textContent = D.name; $("#name").textContent = D.name; $("#role").textContent = D.role;
$("#bio").textContent = D.bio; $("#status").textContent = D.status; $("#cLead").textContent = D.contactLead;
$("#gh").href = $("#gh2").href = D.github;
$("#mail").textContent = D.email; $("#mail").href = $("#send").href = "mailto:" + D.email;
$("#foot").textContent = "© " + new Date().getFullYear() + " " + D.name;
$("#stackList").innerHTML = D.stack.map(r => "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>").join("");
const A = ' <span class="arr">↗</span>';
$("#projects").innerHTML = D.projects.map(p => {
  const priv = p.source === "private";
  const links = (p.github ? '<a href="' + p.github + '" target="_blank" rel="noopener">Source code' + A + "</a>" : "") + (p.live ? '<a href="' + p.live + '" target="_blank" rel="noopener">Live' + A + "</a>" : "");
  return '<article class="proj"><h3>' + esc(p.title) + '<span class="src ' + (priv ? "" : "pub") + '">' + (priv ? "Private source" : "Open source") + "</span></h3>" +
    '<div class="plinks">' + links + "</div><p>" + esc(p.summary) + '</p><div class="tags">' + p.stack.map(s => "<span>" + esc(s) + "</span>").join("") + "</div>" +
    (p.notes ? "<details><summary>How it’s built</summary><ul>" + p.notes.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul></details>" : "") + "</article>";
}).join("");

let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }
async function copyEmail() {
  let ok = false;
  try { await navigator.clipboard.writeText(D.email); ok = true; } catch (e) {
    try { const t = document.createElement("textarea"); t.value = D.email; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove(); } catch (e2) {}
  }
  toast(ok ? "Email copied to clipboard" : "Copy blocked. Email: " + D.email);
}
$("#copy").onclick = $("#copy2").onclick = copyEmail;
</script>
</body>
</html>
